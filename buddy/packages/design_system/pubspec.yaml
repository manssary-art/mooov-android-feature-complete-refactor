name: design_system
description: A design system package.
version: 0.0.1

environment:
  sdk: '>=3.0.0 <4.0.0'
  flutter: '>=3.0.0'

dependencies:
  flutter:
    sdk: flutter


  generated_assets:
    path: ../generated_assets

  core:
    path: ../../../shared/core

  # Image
  extended_image: ^6.3.4
  flutter_svg: ^1.1.6
  cached_network_image: ^3.2.3
  shimmer: ^2.0.0
  cross_file: ^0.3.3+4

  # Form
  flutter_form_builder: ^9.0.0
  form_builder_validators: ^9.0.0

  # Widgets
  auto_size_text: ^3.0.0
  flutter_spinkit: ^5.1.0
  loader_overlay: ^2.1.0
  animations: ^2.0.7
  responsive_framework: ^1.0.0
  flutter_hooks: ^0.18.6
  easy_localization: ^3.0.1
  custom_refresh_indicator: ^2.0.1

  # Maps
  google_maps_flutter: ^2.2.5
  google_maps_flutter_web: ^0.4.0+7

  # Translations
  intl: ^0.18.0
  intl_utils: ^2.8.1


dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^2.0.0
  build_runner: ^2.3.2
  dependency_validator: ^3.2.2


flutter:
